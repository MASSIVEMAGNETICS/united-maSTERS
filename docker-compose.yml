version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - UM_SECRET_KEY=${UM_SECRET_KEY:-demo-secret-key-1234}
      - FLASK_ENV=production
    volumes:
      # Mount a local directory to use as the input for testing
      - ./demo_data:/app/demo_data
    restart: unless-stopped
