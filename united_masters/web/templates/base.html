<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}UnitedMasters Release Workbench{% endblock %}</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d14;
      --surface:  #16161f;
      --card:     #1e1e2c;
      --border:   #2a2a3d;
      --purple:   #9b5cff;
      --purple-d: #7b3fe0;
      --green:    #22c55e;
      --yellow:   #facc15;
      --red:      #ef4444;
      --cyan:     #22d3ee;
      --text:     #e2e8f0;
      --muted:    #8892a4;
      --radius:   10px;
      --font:     'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }

    a { color: var(--purple); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ───────────────────────────────────────────── */
    .page-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    /* ── Header ───────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--purple);
      letter-spacing: 0.03em;
    }
    .logo span { color: var(--green); }
    .version-badge {
      background: var(--border);
      color: var(--muted);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* ── Card ─────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-top: 24px;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--cyan);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    /* ── Form elements ────────────────────────────────────── */
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }
    input[type="text"], select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 9px 13px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus, select:focus { border-color: var(--purple); }

    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
      user-select: none;
      transition: border-color .2s;
    }
    .checkbox-item:has(input:checked) { border-color: var(--purple); color: var(--purple); }
    .checkbox-item input { accent-color: var(--purple); }

    .form-row { margin-top: 18px; }

    /* ── Button ───────────────────────────────────────────── */
    .btn-primary {
      display: inline-block;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
      margin-top: 20px;
    }
    .btn-primary:hover { background: var(--purple-d); }

    /* ── Badge ────────────────────────────────────────────── */
    .badge {
      display: inline-block;
      border-radius: 4px;
      padding: 1px 8px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-green  { background: rgba(34,197,94,.15);  color: var(--green); }
    .badge-yellow { background: rgba(250,204,21,.15); color: var(--yellow); }
    .badge-red    { background: rgba(239,68,68,.15);  color: var(--red); }
    .badge-cyan   { background: rgba(34,211,238,.15); color: var(--cyan); }

    /* ── Alert ────────────────────────────────────────────── */
    .alert {
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 18px;
      font-size: 0.9rem;
    }
    .alert-warn { background: rgba(250,204,21,.08); border: 1px solid rgba(250,204,21,.25); color: var(--yellow); }
    .alert-err  { background: rgba(239,68,68,.08);  border: 1px solid rgba(239,68,68,.25);  color: var(--red); }
    .alert-info { background: rgba(34,211,238,.08); border: 1px solid rgba(34,211,238,.25); color: var(--cyan); }

    /* ── Table ────────────────────────────────────────────── */
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }

    /* ── Misc ─────────────────────────────────────────────── */
    .muted { color: var(--muted); }
    .mono { font-family: monospace; font-size: 0.85rem; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .section-gap { margin-top: 32px; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">United<span>Masters</span> Release Workbench <span class="version-badge">v{{ version }}</span></div>
      <nav style="font-size:0.85rem; color:var(--muted);">Local-first release factory</nav>
    </div>
  </header>

  <div class="page-wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
